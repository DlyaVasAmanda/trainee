<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EBEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<title>Тренировки</title>
<style>
  :root{
    --bg:#E8EBEE; --surface:#FFFFFF; --surface-2:#F1F3F5; --ink:#14161A; --mute:#5F6670; --line:#DDE1E5;
    --on-ink:#FFFFFF; --danger:#C62F3B;
    /* Цвета групп мышц: по мотивам соревновательных блинов */
    --g-chest:#D62839; --g-back:#2563C9; --g-legs:#E0A400; --g-shoulders:#1F9D55;
    --g-triceps:#E8661C; --g-biceps:#7A4FD6; --g-abs:#7D8590; --g-cardio:#0E9AA0; --g-other:#A3A9B1;
    --r-lg:24px; --r-md:16px; --r-sm:12px;
    --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
    --f-body:'Barlow',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181B; --surface:#212429; --surface-2:#2B2F35; --ink:#F1F3F5; --mute:#9BA2AC; --line:#33383F;
      --on-ink:#16181B; --danger:#F26874;
      --g-chest:#EE3E4F; --g-back:#4A85F0; --g-legs:#F4BC1C; --g-shoulders:#2FBF6E;
      --g-triceps:#F7823C; --g-biceps:#9A75F0; --g-abs:#959DA8; --g-cardio:#22B8BE; --g-other:#6D737C;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
  #app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
  h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.05;letter-spacing:.2px}
  h1{font-size:38px}
  h2{font-size:26px}
  h3{font-size:20px;font-weight:600}
  p{margin:0}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
  .sub{color:var(--mute);font-size:15px;margin-top:4px}
  .section{margin-top:28px}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .mute{color:var(--mute)}
  .small{font-size:14px}
  .num{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}

  /* Поверхности */
  .sheet{background:var(--surface);border-radius:var(--r-lg);padding:20px}
  .list{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);min-height:56px}
  .item:first-child{border-top:0}
  .item .grow{flex:1;min-width:0}
  .stack{display:grid;gap:10px}

  /* Кнопки и поля */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border:0;border-radius:999px;
    background:var(--surface-2);color:var(--ink);font:600 16px var(--f-body);cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--on-ink)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger)}
  .btn.block{width:100%}
  .btn.sm{height:36px;padding:0 14px;font-size:14px}
  .btn.big{height:56px;font-size:17px}
  .icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;
    background:transparent;color:var(--mute);cursor:pointer;flex:none}
  .icon-btn svg{width:18px;height:18px}
  input,select{font:500 16px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);
    height:46px;padding:0 12px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
  input::placeholder{color:var(--mute);opacity:.7}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  input:focus,select:focus{outline:none;border-color:var(--ink)}

  /* Метки групп */
  .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 10px 4px 8px;border-radius:999px;background:var(--surface-2)}
  .tag{font-size:12px;color:var(--mute);background:var(--surface-2);border-radius:6px;padding:1px 6px;white-space:nowrap}

  /* Блин: сегменты — группы мышц дня */
  .plate{--size:36px;--hole:var(--surface);position:relative;width:var(--size);height:var(--size);border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center}
  .plate::after{content:'';position:absolute;inset:30%;border-radius:50%;background:var(--hole)}
  .plate.rest{background:repeating-conic-gradient(var(--line) 0 7.5deg,transparent 7.5deg 15deg)}
  .plate .mark{position:relative;z-index:1;font:700 calc(var(--size) * .3) var(--f-display);color:var(--ink)}
  .plate.big{--size:116px}
  .plate.big::after{inset:27%;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--ink) 8%,transparent)}
  @media (prefers-reduced-motion:no-preference){
    .plate.big.spin{animation:spin .7s cubic-bezier(.2,.8,.2,1)}
    @keyframes spin{from{transform:rotate(-120deg) scale(.85);opacity:.3}to{transform:none;opacity:1}}
  }

  /* Неделя */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 -4px 14px}
  .day{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border:0;border-radius:var(--r-md);
    background:transparent;color:var(--mute);font:500 13px var(--f-body);cursor:pointer}
  .day .plate{--hole:var(--bg)}
  .day.sel{background:var(--surface);color:var(--ink)}
  .day.sel .plate{--hole:var(--surface)}
  .day.today .d{color:var(--ink);font-weight:700}
  .day .n{font:600 15px var(--f-display);color:var(--ink)}
  .day.past:not(.done):not(.sel) .plate:not(.rest){opacity:.45}

  /* Главный блок дня */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
  .hero h2{font-size:30px;margin:2px 0 8px;overflow-wrap:anywhere}
  .plan-rows{margin-top:18px}
  .plan-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .plan-row .target{margin-left:auto;font:600 18px var(--f-display);white-space:nowrap}
  .done-note{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);font-size:14px}

  /* Активная тренировка */
  .entry{background:var(--surface);border-radius:var(--r-md);padding:14px 14px 14px 16px;box-shadow:inset 4px 0 0 var(--c)}
  .entry-head{display:flex;align-items:center;gap:8px}
  .entry-head b{font-weight:600;font-size:17px}
  .entry .meta{font-size:14px;color:var(--mute);margin-top:2px}
  .entry.complete .entry-head b::after{content:' ✓';color:var(--c)}
  .sets{margin-top:8px}
  .set-row{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
  .set-row .i{font:600 15px var(--f-display);color:var(--mute);width:18px}
  .set-row .v{flex:1;font:600 19px var(--f-display);font-variant-numeric:tabular-nums}
  .set-input{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px;margin-top:10px}
  .set-input .btn{height:46px;padding:0;border-radius:var(--r-sm)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .live{display:inline-flex;align-items:center;gap:8px}
  .live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--g-chest)}

  /* Статистика и графики */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--surface);border-radius:var(--r-md);padding:14px}
  .stat .num{display:block;font-size:34px;line-height:1}
  .stat span:last-child{font-size:13px;color:var(--mute)}
  .bar-row{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
  .bar{height:12px;border-radius:6px;background:var(--c)}
  .chart text{fill:var(--mute);font:500 11px var(--f-body)}

  /* Шаблоны */
  .tpl-item{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .tpl-item .name{all:unset;cursor:pointer;line-height:1.25;overflow-wrap:anywhere}
  .tpl-item .ctl{display:grid;grid-template-columns:48px 12px 52px 32px;gap:4px;align-items:center}
  .tpl-item input{height:38px;text-align:center;padding:0 4px}
  .tpl-item .x{color:var(--mute);text-align:center}
  .plan-select{flex:0 1 168px}
  .add-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}

  .empty{text-align:center;color:var(--mute);padding:36px 12px}
  .empty .btn{margin-top:14px}

  /* Нижняя навигация */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav .in{max-width:560px;margin:0 auto;display:flex}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;border:0;background:transparent;
    color:var(--mute);font:500 11px var(--f-body);cursor:pointer;position:relative}
  nav button svg{width:24px;height:24px}
  nav button.on{color:var(--ink);font-weight:600}
  nav button.rec::after{content:'';position:absolute;top:8px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--g-chest);
    box-shadow:0 0 0 2px var(--surface)}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<script src="app.js"></script>
</body>
</html>
