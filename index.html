<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Тренировки</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaf0; --mute:#8a90a0;
    --accent:#4ade80; --accent-ink:#06210f; --danger:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{max-width:640px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
  h1{font-size:22px;margin:0 0 14px}
  h2{font-size:17px;margin:18px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;gap:8px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .spread{justify-content:space-between}
  .mute{color:var(--mute);font-size:14px}
  .tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  button{font:inherit;color:var(--text);background:#232733;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.danger{color:var(--danger)}
  button.small{padding:6px 10px;font-size:14px}
  button.block{width:100%}
  input,select{font:inherit;color:var(--text);background:#10131a;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
  .set{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
  nav{position:fixed;left:0;right:0;bottom:0;background:#12151bee;backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;border-radius:0;background:transparent;padding:14px 4px;color:var(--mute);font-size:13px}
  nav button.on{color:var(--accent)}
  svg text{fill:var(--mute);font-size:10px}
  .empty{text-align:center;color:var(--mute);padding:28px 0}
  .stat{flex:1;text-align:center}
  .stat b{display:block;font-size:22px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script src="app.js"></script>
</body>
</html>
